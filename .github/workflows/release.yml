name: Push Image
run-name: Release ${{ github.ref_name }}
on:
  release:
    types: [published]

env:
  GITHUB_ACTION_TAG: ${{ github.ref_name }}

jobs:
  push-multiarch:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v6

    - name: get the build-args values
      id: get-build-args
      run: |
        echo "$(make -s log | grep TAG)" >> "$GITHUB_ENV"
        echo "$(make -s log | grep GOLANG_VERSION)" >> "$GITHUB_ENV"

    - name: Build and push image
      uses: tashima42/ecm-distro-tools/actions/publish-image@add-prime-make-target
      with:
        image: hardened-kubernetes
        tag: ${{ github.event.release.tag_name }}
        public-repo: rancher
        public-registry: docker.io
        public-username: ${{ secrets.DOCKERIO_USER }}
        public-password: ${{ secrets.DOCKERIO_PASSWORD }}

        prime-repo: rancher
        prime-make-target: push-prime-image
        prime-registry: quay.io
        prime-username: ${{ secrets.QUAY_USER }}
        prime-password: ${{ secrets.QUAY_PASSWORD }}
